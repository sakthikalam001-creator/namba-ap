name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SSH into AWS EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🚀 Starting deployment on AWS EC2..."
            
            # Dynamically locate repository folder on EC2
            if [ -d "$HOME/namba-ap" ]; then
              cd "$HOME/namba-ap"
            elif [ -d "$HOME/namba-app" ]; then
              cd "$HOME/namba-app"
            elif [ -d "/var/www/namba-ap" ]; then
              cd /var/www/namba-ap
            elif [ -d "/var/www/namba-app" ]; then
              cd /var/www/namba-app
            else
              TARGET_DIR=$(find $HOME /var/www -maxdepth 3 -name ".git" 2>/dev/null | head -n 1 | xargs dirname 2>/dev/null)
              if [ -n "$TARGET_DIR" ]; then
                cd "$TARGET_DIR"
              fi
            fi
            
            echo "📂 Working directory: $(pwd)"
            
            # Pull latest code from GitHub
            git pull origin main
            
            # Navigate to namba_backend
            if [ -d "namba_backend" ]; then
              cd namba_backend
            fi
            
            # Install production dependencies
            npm install
            
            # Restart PM2 backend process
            pm2 restart all || pm2 start server.js --name "namba-backend"
            
            echo "✅ AWS EC2 Deployment Complete!"


