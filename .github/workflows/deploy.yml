name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SSH into AWS EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment on AWS EC2..."
            
            # Configure safe directory
            git config --global --add safe.directory /home/ubuntu/namba-ap || true
            
            # Navigate to repository directory on EC2
            if [ -d "/home/ubuntu/namba-ap" ]; then
              cd /home/ubuntu/namba-ap
            elif [ -d "$HOME/namba-ap" ]; then
              cd "$HOME/namba-ap"
            else
              cd $(find $HOME /var/www -maxdepth 3 -name ".git" 2>/dev/null | head -n 1 | xargs dirname)
            fi
            
            echo "📂 Working directory: $(pwd)"
            
            # Reset and pull clean code from GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Navigate to namba_backend
            if [ -d "namba_backend" ]; then
              cd namba_backend
            fi
            
            # Install production dependencies
            npm install --production
            
            # Restart PM2 server process
            pm2 restart server || pm2 restart all || pm2 start server.js --name "server"
            
            echo "✅ AWS EC2 Deployment Complete!"



