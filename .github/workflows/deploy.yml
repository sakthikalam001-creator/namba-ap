name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: SSH into AWS EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🚀 Starting deployment on AWS EC2..."
            
            # Find or navigate to project directory
            if [ -d "~/namba-app" ]; then
              cd ~/namba-app
            elif [ -d "/var/www/namba-app" ]; then
              cd /var/www/namba-app
            elif [ -d "~/namba" ]; then
              cd ~/namba
            else
              cd ~/
            fi
            
            # Pull latest changes from GitHub
            if [ -d ".git" ]; then
              git pull origin main
            else
              echo "⚠️ Git repository not initialized in this folder."
            fi
            
            # Navigate to backend directory
            if [ -d "namba_backend" ]; then
              cd namba_backend
            fi
            
            # Install any new npm packages
            npm install --production
            
            # Restart PM2 process
            pm2 restart all || pm2 start server.js --name "namba-backend"
            
            echo "✅ Deployment completed successfully!"

